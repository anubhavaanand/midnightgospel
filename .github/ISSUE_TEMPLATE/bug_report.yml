name: 🐞 Bug Report
description: Report a bug in the 3D Multiverse Simulator
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide as much context as possible so we can reproduce it.
  - type: input
    id: episode
    attributes:
      label: Episode / Level ID
      description: Which dimension did this occur in? (e.g., Chromatic Ribbon, Zombie Capitol)
      placeholder: Episode 1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      value: |
        1. Spawn into the Hub
        2. Navigate to...
        3. Observe...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: What browser and operating system are you using?
      placeholder: Chrome 114 on Windows 11
    validations:
      required: true
